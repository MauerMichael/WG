# Production-Stack: nur die App (gunicorn).
#
# Reverse-Proxy / HTTPS uebernimmt der schon laufende n8n-Traefik auf der VPS
# (Port 80/443). Vorerst mappen wir die App direkt auf Host-Port 8000 fuer
# einen schnellen ersten Test ueber http://<vps>:8000.
# Naechster Schritt: Traefik-Labels + HTTPS.
#
# Postgres laeuft als eigener Container auf der VPS (Port 32770 am Host).
#
# Start:   docker compose up -d --build
# Logs:    docker compose logs -f app
# Update:  git pull && docker compose up -d --build
# Schema:  docker compose exec app alembic upgrade head

services:
  app:
    build: .
    container_name: wg-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
